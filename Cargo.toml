[package]
name = "mflux-rs"
version = "0.0.1"
edition = "2021"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
description = "High-performance native Apple Silicon Rust port of FLUX.1 generative image model using MLX"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bhubbard/mflux-rs"
homepage = "http://code.brandonhubbard.com/mflux-rs/"

[[bin]]
name = "mflux"
path = "src/bin/main.rs"

[lib]
name = "mflux_rs"
path = "src/lib.rs"

[dependencies]
mlx-rs = "0.32.0"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
safetensors = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3.12"
